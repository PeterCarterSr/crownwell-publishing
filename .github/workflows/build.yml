name: Build Crownwell Run (Phase 1A)

on:
  workflow_dispatch:
    inputs:
      project_yaml:
        description: "Path to runs/<run>/project.yaml"
        required: true
        default: "runs/2026-02-03_cartwright-autobiography/project.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Determine output path (for artifact upload)
        id: outpath
        env:
          PROJECT_YAML: ${{ inputs.project_yaml }}
        run: |
          python - << 'PY'
          import os, sys, yaml
          p = os.environ.get("PROJECT_YAML","").strip()
          if not p:
            print("PROJECT_YAML missing", file=sys.stderr)
            sys.exit(1)
          with open(p, "r", encoding="utf-8") as f:
            data = yaml.safe_load(f) or {}
          out_path = (data.get("output") or {}).get("path") or ""
          if not out_path:
            print("output.path missing in project.yaml", file=sys.stderr)
            sys.exit(1)
          # Write to GITHUB_OUTPUT for modern Actions
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
            gh_out.write(f"out_path={out_path}\n")
          PY

      - name: Run build
        env:
          PROJECT_YAML: ${{ inputs.project_yaml }}
        run: python3 tools/build.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: crownwell-output
          path: |
            ${{ steps.outpath.outputs.out_path }}/**
